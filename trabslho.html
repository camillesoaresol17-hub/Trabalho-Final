<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trabslho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #9b6bff;
    --bg2: #6a2fc9;
    --bg3: #2a0f5c;
    --card: rgba(255, 255, 255, 0.16);
    --card-border: rgba(255, 255, 255, 0.35);
    --text: #fff;
    --yes: #fff;
    --yes-text: #6a2fc9;
    --no: rgba(255, 255, 255, 0.22);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg1: #7a4ad6; --bg2: #4b1e96; --bg3: #1a0a3d; }
  }
  :root[data-theme="dark"] { --bg1: #7a4ad6; --bg2: #4b1e96; --bg3: #1a0a3d; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Quicksand", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(circle at 20% 15%, var(--bg1), var(--bg2) 55%, var(--bg3));
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; text-align: center;
  }
  .hearts { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .heart {
    position: absolute; bottom: -40px; opacity: 0;
    animation: rise linear infinite;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: .55; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }
  .card {
    position: relative; z-index: 1;
    width: min(88vw, 440px);
    padding: 40px 28px 36px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 28px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(30, 5, 70, .35);
  }
  .emoji { font-size: 54px; line-height: 1; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  h1 {
    font-family: "Pacifico", cursive, serif;
    font-weight: 400; font-size: clamp(30px, 8vw, 40px);
    margin: 18px 0 6px; line-height: 1.25;
  }
  p.sub { margin: 0 0 28px; font-size: 16px; opacity: .85; }
  .options { display: flex; gap: 14px; justify-content: center; align-items: center; min-height: 64px; }
  button {
    font-family: inherit; font-weight: 700; font-size: 17px;
    border: 0; border-radius: 999px; padding: 14px 34px; cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  #yesBtn { background: var(--yes); color: var(--yes-text); box-shadow: 0 8px 22px rgba(0,0,0,.25); }
  #yesBtn:hover { transform: scale(1.06); }
  #noBtn { background: var(--no); color: var(--text); border: 1px solid var(--card-border); }

  .overlay {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(30, 5, 70, .55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fff; color: #6a2fc9; border-radius: 28px; padding: 34px 28px;
    width: min(88vw, 380px); box-shadow: 0 25px 70px rgba(0,0,0,.4);
    animation: pop .5s cubic-bezier(.2, 1.4, .4, 1);
  }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h2 { font-family: "Pacifico", cursive, serif; font-weight: 400; font-size: 30px; margin: 10px 0 8px; }
  .modal p { margin: 0 0 22px; font-size: 17px; }
  .modal button { background: #6a2fc9; color: #fff; }
  .confetti { position: fixed; z-index: 11; pointer-events: none; font-size: 26px; animation: burst 1.6s ease-out forwards; }
  @keyframes burst {
    from { transform: translate(0, 0) scale(.4); opacity: 1; }
    to { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(40deg); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart, .emoji, .confetti { animation: none; }
    .heart { opacity: .3; }
  }
</style>
</head>
<body>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="emoji" aria-hidden="true">💌</div>
    <h1>Quer namorar comigo?</h1>
    <p class="sub">Pense com carinho...</p>
    <div class="options">
      <button id="yesBtn" type="button">Sim 💜</button>
      <button id="noBtn" type="button">Não</button>
    </div>
  </main>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div style="font-size:48px" aria-hidden="true">🥰</div>
      <h2>Eu te amo, meu amor 💕</h2>
      <p>Você acabou de me fazer a pessoa mais feliz do mundo.</p>
      <button type="button" id="okBtn">OK</button>
    </div>
  </div>

<script>
  // Corações flutuando ao fundo
  var hearts = document.getElementById('hearts');
  var symbols = ['💜', '💖', '💗', '💕'];
  for (var i = 0; i < 16; i++) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = symbols[i % symbols.length];
    h.style.left = Math.random() * 100 + '%';
    h.style.fontSize = (16 + Math.random() * 26) + 'px';
    h.style.animationDuration = (8 + Math.random() * 9) + 's';
    h.style.animationDelay = (-Math.random() * 14) + 's';
    hearts.appendChild(h);
  }

  var noBtn = document.getElementById('noBtn');
  var yesBtn = document.getElementById('yesBtn');
  var scale = 1;

  function moveButton(e) {
    if (e) e.preventDefault();
    var margin = 16;
    var w = noBtn.offsetWidth, h = noBtn.offsetHeight;
    noBtn.style.position = 'fixed';
    noBtn.style.left = margin + Math.random() * (window.innerWidth - w - 2 * margin) + 'px';
    noBtn.style.top = margin + Math.random() * (window.innerHeight - h - 2 * margin) + 'px';
    noBtn.style.zIndex = 5;
    // O "Sim" cresce um pouquinho a cada fuga
    scale = Math.min(scale + 0.12, 1.8);
    yesBtn.style.transform = 'scale(' + scale + ')';
  }
  noBtn.addEventListener('mouseover', moveButton);
  noBtn.addEventListener('touchstart', moveButton, { passive: false });
  noBtn.addEventListener('click', moveButton);

  yesBtn.addEventListener('click', function () {
    document.getElementById('overlay').classList.add('show');
    var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    for (var i = 0; i < 28; i++) {
      var c = document.createElement('span');
      c.className = 'confetti';
      c.textContent = symbols[i % symbols.length];
      c.style.left = cx + 'px';
      c.style.top = cy + 'px';
      var a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 260;
      c.style.setProperty('--dx', Math.cos(a) * d + 'px');
      c.style.setProperty('--dy', Math.sin(a) * d + 'px');
      document.body.appendChild(c);
      setTimeout(function (el) { el.remove(); }, 1700, c);
    }
  });

  document.getElementById('okBtn').addEventListener('click', function () {
    document.getElementById('overlay').classList.remove('show');
  });
</script>
</body>
</html>
